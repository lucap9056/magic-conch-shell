name: Publish Core

on:
  push:
    tags:
      - 'core/v2/v*.*.*'

jobs:
  publish:
    name: Build & Publish Core Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Core)
        id: meta-core
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/magic-conch-shell-core
          tags: |
            type=match,pattern=core/v2/v(.*),group=1
            type=raw,value=latest

      - name: Build and Push Core
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-core.outputs.tags }}
          labels: ${{ steps.meta-core.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
