name: Publish HTTP Server

on:
  push:
    tags:
      - 'httpserver/v*.*.*'

jobs:
  publish:
    name: Build & Publish HTTP Server Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (HTTP Server)
        id: meta-httpserver
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/magic-conch-shell-httpserver
          tags: |
            type=match,pattern=httpserver/v(.*),group=1
            type=raw,value=latest

      - name: Build and Push HTTP Server
        uses: docker/build-push-action@v5
        with:
          context: ./httpserver
          file: ./httpserver/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-httpserver.outputs.tags }}
          labels: ${{ steps.meta-httpserver.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
