name: Publish Fileupload

on:
  push:
    tags:
      - 'fileupload/v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish Fileupload Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Normalize registry owner
        id: owner
        run: echo "name=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Fileupload)
        id: meta-fileupload
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/magic-conch-shell/fileupload
          tags: |
            type=match,pattern=fileupload/v(.*),group=1,prefix=v
            type=match,pattern=fileupload/v(.*),group=1
            type=match,pattern=fileupload/v(\d+\.\d+)\.\d+,group=1,prefix=v
            type=match,pattern=fileupload/v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest

      - name: Build and Push Fileupload
        uses: docker/build-push-action@v5
        with:
          context: ./fileupload
          file: ./fileupload/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-fileupload.outputs.tags }}
          labels: ${{ steps.meta-fileupload.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
