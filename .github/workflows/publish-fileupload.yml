name: Publish Fileupload

on:
  push:
    tags:
      - 'fileupload/v*.*.*'

jobs:
  publish:
    name: Build & Publish Fileupload Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Metadata (Fileupload)
        id: meta-fileupload
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/magic-conch-shell-fileupload
          tags: |
            type=match,pattern=fileupload/v(.*),group=1
            type=raw,value=latest

      - name: Build and Push Fileupload
        uses: docker/build-push-action@v5
        with:
          context: ./fileupload
          file: ./fileupload/docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-fileupload.outputs.tags }}
          labels: ${{ steps.meta-fileupload.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
