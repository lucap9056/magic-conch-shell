services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U auth -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  core:
    image: ghcr.io/lucap9056/magic-conch-shell/core:3.0.0
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_NAME: gemini-2.5-flash-lite
      FILE_TOKEN_KEYS: ${FILE_TOKEN_KEY}
      GRPC_ADDRESS: :50051
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/grpc_health_probe", "-addr=localhost:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  fileupload:
    image: ghcr.io/lucap9056/magic-conch-shell/fileupload:2.0.0
    environment:
      HTTP_ADDRESS: :8080
      GEMINI_API_KEY: ${LLM_API_KEY}
      FILE_TOKEN_KEY: ${FILE_TOKEN_KEY}
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  magic-conch-api:
    image: ghcr.io/lucap9056/magic-conch-shell/httpserver:3.0.0
    environment:
      HTTP_ADDRESS: :8080
      GRPC_ADDRESS: core:50051
      CORS_ALLOWED_ORIGINS: "*"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  dex:
    image: ghcr.io/dexidp/dex:v2.46.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    restart: unless-stopped

  corvauth:
    image: ghcr.io/lucap9056/corvauth:0.4
    environment:
      DATABASE_URL: postgres://auth:changeme@postgres/auth?sslmode=disable
      DB_AUTO_CREATE_SCHEMA: "true"
      REDIS_URL: redis://redis:6379
      OAUTH2_PROVIDER: test-provider
      OAUTH2_CLIENT_ID: test-client
      OAUTH2_CLIENT_SECRET: test-secret
      OAUTH2_REDIRECT_URL: https://localhost/auth/callback
      OAUTH2_AUTH_URL: https://localhost/oauth2/auth
      OAUTH2_TOKEN_URL: http://dex:5556/oauth2/token
      OAUTH2_USERINFO_URL: http://dex:5556/oauth2/userinfo
      OAUTH2_SCOPES: openid,email,profile
      ALLOW_REGISTRATION: "true"
      JWT_REFRESH_TOKEN_DURATION: 1d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dex:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: caddy:2.10.0
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    environment:
      CADDY_HOST: "0.0.0.0"
      GATEWAY_PORT: "443"
      TLS_CERT_FILE: /etc/caddy/certs/gateway.crt
      TLS_KEY_FILE: /etc/caddy/certs/gateway.key
    depends_on:
      corvauth:
        condition: service_healthy
      fileupload:
        condition: service_healthy
      magic-conch-api:
        condition: service_healthy
