services:

  init-sql-fetcher:
    image: alpine:3.20
    entrypoint: >
      sh -c "
      apk add --no-cache curl &&
      curl -fsSL https://raw.githubusercontent.com/lucap9056/auth-middleware/1e17700df4f504fc11288a4d6ef679f2d7856f06/database/init.sql
      -o /init-sql/init.sql
      "
    volumes:
      - init_sql:/init-sql
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: changeme
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - init_sql:/docker-entrypoint-initdb.d:ro
    depends_on:
      init-sql-fetcher:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  core:
    image: lucap9056/magic-conch-shell-core:2.0.1
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      MODEL_NAME: gemini-2.5-flash-lite
      ALLOWED_IMAGE_DOMAINS: rediscache
      IMAGE_CACHE_PATH: redis://redis:6379
      GRPC_ADDRESS: unix:///var/run/nautrouds/core.sock
    volumes:
      - ./certs:/certs
      - nautrouds_sockets:/var/run/nautrouds
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  fileupload:
    image: lucap9056/magic-conch-shell-fileupload:1.2.1
    environment:
      HTTP_ADDRESS: unix:///var/run/nautrouds/services/fileupload/node-0.sock
      GEMINI_API_KEY: ${LLM_API_KEY}
      REDIS_URL: redis://redis:6379
      RDX_HOSTNAME: rediscache
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - nautrouds_sockets:/var/run/nautrouds
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  magic-conch-api:
    image: lucap9056/magic-conch-shell-httpserver:2.2.0
    environment:
      HTTP_ADDRESS: unix:///var/run/nautrouds/services/magic-conch-api/node-0.sock
      GRPC_ADDRESS: unix:///var/run/nautrouds/core.sock
      CORS_ALLOWED_ORIGINS: "*"
    volumes:
      - nautrouds_sockets:/var/run/nautrouds
    restart: unless-stopped

  oauth2-provider:
    image: oauth2-test-provider:local
    environment:
      LISTEN_ADDR: "unix:///var/run/nautrouds/services/oauth2-provider/node-0.sock"
      ISSUER_URL: "https://gateway/oauth2"
    volumes:
      - nautrouds_sockets:/var/run/nautrouds
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/nautrouds/services/oauth2-provider/node-0.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  auth-service:
    image: lucap9056/oauth2-middleware:2.0.0
    environment:
      DATABASE_URL: postgres://auth:changeme@postgres/auth?sslmode=disable
      HTTP_ADDRESS: unix:///var/run/nautrouds/services/auth-service/node-0.sock
      OAUTH2_CLIENT_ID: test-client
      OAUTH2_CLIENT_SECRET: test-secret
      OAUTH2_REDIRECT_URL: https://localhost/auth/callback
      OIDC_ISSUER_URL: https://gateway/oauth2
      OAUTH2_AUTH_URL: https://localhost/oauth2/auth
      OAUTH2_TOKEN_URL: https://gateway/oauth2/token
      OAUTH2_USERINFO_URL: https://gateway/oauth2/userinfo
      OAUTH2_SCOPES: openid,email,profile
      ALLOW_REGISTRATION: "true"
      REFRESH_TOKEN_TTL: 24h
      REDIS_URL: redis://redis:6379
    volumes:
      - nautrouds_sockets:/var/run/nautrouds
      - ./certs/gatewayCA.cert:/usr/local/share/ca-certificates/gatewayCA.crt:ro
    entrypoint: >
      sh -c "
      update-ca-certificates &&
      exec /app/oauth2
      "
    depends_on:
      postgres:
        condition: service_healthy
      oauth2-provider:
        condition: service_healthy
    links:
      - gateway
    restart: unless-stopped

  nautrouds:
    image: lucap9056/nautrouds:26-06.19-05
    environment:
      NAUTROUDS_CONFIG: /etc/nautrouds/Ntufile
    volumes:
      - ./nautrouds:/etc/nautrouds:ro
      - nautrouds_sockets:/var/run/nautrouds
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -S /var/run/nautrouds/entrypoints/nautrouds-0.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway:
    image: caddy:2.10.0
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - nautrouds_sockets:/var/run/nautrouds
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
    environment:
      CADDY_HOST: "0.0.0.0"
      GATEWAY_PORT: "443"
      TLS_CERT_FILE: /etc/caddy/certs/gateway.crt
      TLS_KEY_FILE: /etc/caddy/certs/gateway.key
    depends_on:
      nautrouds:
        condition: service_healthy


volumes:
  nautrouds_sockets:
  init_sql:
