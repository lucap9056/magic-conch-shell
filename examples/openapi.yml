openapi: 3.0.3
info:
  title: Magic Conch Shell — Integration Gateway
  description: >
    Public HTTP surface of the `examples/` stack, as seen by a client hitting the
    Caddy gateway on `https://localhost`. Backend services are reachable only on the
    compose network; every path below goes through the gateway, which routes it per
    `examples/Caddyfile`.
  version: "3.0.0"
externalDocs:
  description: Service-by-service notes
  url: ./README.md
servers:
  - url: https://localhost
    description: Gateway (self-signed cert, trust examples/certs/gatewayCA.cert)

tags:
  - name: health
  - name: dex
    description: Dex with the mockCallback connector — test-only, signs everyone in as a fixed mock user. See README.md#dex
  - name: auth
    description: corvauth — device-bound session/JWT management. See README.md#corvauth
  - name: chat
    description: magic-conch-api (httpserver). See README.md#magic-conch-api
  - name: upload
    description: fileupload service. See README.md#fileupload

paths:
  /health:
    get:
      tags: [health]
      summary: Gateway liveness check
      description: Answered directly by the gateway (`respond "OK" 200`).
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema: { type: string, example: "OK" }

  /oauth2/.well-known/openid-configuration:
    get:
      tags: [dex]
      summary: OIDC discovery document
      responses:
        "200":
          description: Discovery document
          content:
            application/json:
              schema: { type: object }

  /oauth2/auth:
    get:
      tags: [dex]
      summary: Authorization endpoint (Dex mockCallback — signs in the mock user without a login form)
      parameters:
        - { name: response_type, in: query, schema: { type: string, enum: [code] }, example: code }
        - { name: client_id, in: query, schema: { type: string } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, schema: { type: string, enum: [S256] } }
        - { name: scope, in: query, schema: { type: string } }
      responses:
        "302":
          description: >
            Starts a redirect chain inside Dex (connector login, callback). Follow 302/303 redirects
            until Location reaches redirect_uri with `code` and `state` query params.
          headers:
            Location: { schema: { type: string, format: uri } }

  /oauth2/token:
    post:
      tags: [dex]
      summary: Token endpoint
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, code_verifier]
              properties:
                grant_type: { type: string, example: authorization_code }
                code: { type: string }
                code_verifier: { type: string }
                redirect_uri: { type: string }
                client_id: { type: string }
      responses:
        "200":
          description: Token response
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  id_token: { type: string, description: "RS256-signed JWT; keys at /oauth2/keys" }

  /oauth2/userinfo:
    get:
      tags: [dex]
      summary: Userinfo endpoint — returns the mock user (`kilgore@kilgore.trout`)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Mock user identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  sub: { type: string }
                  email: { type: string, example: kilgore@kilgore.trout }
                  email_verified: { type: boolean, example: true }
                  name: { type: string, example: Kilgore Trout }

  /auth/login:
    get:
      tags: [auth]
      summary: Start login — get the provider authorize URL
      responses:
        "200":
          description: Authorize URL (and PKCE verifier, if server-side PKCE holds it — this deployment's default)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          url: { type: string, format: uri }
                          verifier: { type: string, description: "Only present when the client is expected to hold the PKCE verifier (OAUTH2_CLIENT_PKCE=true). Unused in this deployment's default flow." }

  /auth/callback:
    get:
      tags: [auth]
      summary: Finish login — exchange the provider's code for a Magic Conch Shell JWT session
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: X-Device-Name, in: header, schema: { type: string }, description: "Optional label stored in user_devices.device_name" }
        - { name: X-PKCE-Verifier, in: header, schema: { type: string }, description: "Required only if OAUTH2_CLIENT_PKCE=true" }
      responses:
        "200":
          description: Issued session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message: { $ref: "#/components/schemas/TokenPair" }
        "400": { description: "Missing/invalid code or state" }
        "401": { description: "State not found / expired (login flow timed out)" }

  /auth/verify:
    get:
      tags: [auth]
      summary: Validate an access token (also the gateway's forward_auth target for /api/*)
      security: [{ bearerAuth: [] }]
      responses:
        "204":
          description: Valid token. Identity is returned via response headers, which the gateway copies onto the forwarded request.
          headers:
            X-Forwarded-User-Email: { schema: { type: string } }
            X-Forwarded-Device-ID: { schema: { type: string } }
            X-Forwarded-Username: { schema: { type: string }, description: "Present when the user has a username" }
        "401":
          description: Missing/invalid/expired token
          headers:
            WWW-Authenticate: { schema: { type: string, example: Bearer } }
            X-Auth-Error: { schema: { type: string, enum: [device_not_found, invalid_signature] }, description: "Present when the device session caused the 401" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }

  /auth/verify-optional:
    get:
      tags: [auth]
      summary: Like /auth/verify, but returns 204 without identity headers when no Bearer token is sent
      responses:
        "204":
          description: Anonymous, or a valid token with the same identity headers as /auth/verify
        "401": { description: "A Bearer token was sent and is invalid/expired" }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token and issue a new access+refresh pair
      description: >
        Send the refresh token as the `refresh_token` cookie, or as a `refresh_token` field
        in the JSON body when the cookie is absent. Sets a new `refresh_token` cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: "Invalid/expired/revoked refresh token" }

  /auth/refresh-access:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new access token only (no rotation of the refresh token)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: New access token
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message: { type: string, description: "New access token (plain string, not a token pair)" }
        "401": { description: "Invalid/expired/revoked refresh token" }

  /auth/refresh-status:
    post:
      tags: [auth]
      summary: Inspect a refresh token without rotating it
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Refresh token details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          device_id: { type: string }
                          issued_at: { type: integer, description: "Unix seconds" }
                          expires_at: { type: integer, description: "Unix seconds" }
        "401": { description: "Invalid/expired/revoked refresh token" }

  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current device session and clear the refresh_token cookie
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }

  /auth/users/me:
    delete:
      tags: [auth]
      summary: Delete the authenticated user and all of their devices
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }
        "401": { description: "Missing/invalid token" }

  /api/upload:
    post:
      tags: [upload]
      summary: Upload an image for use in a chat message
      description: >
        JWT is validated by the gateway (`forward_auth` to corvauth `/verify` before
        forwarding); fileupload itself performs no authentication.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "PNG, JPEG, WEBP, HEIF or HEIC only, max 20MB"
      responses:
        "200":
          description: Uploaded
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiEnvelope"
                  - type: object
                    properties:
                      message:
                        type: object
                        properties:
                          key: { type: string, description: "Signed filetoken (mcsft1.…), valid for 47h — pass this as PromptPart.content for an image part" }
                          mime_type: { type: string }
        "400": { description: "Missing file, file too large, or unsupported MIME type" }
        "401": { description: "Missing/invalid token" }

  /api/:
    post:
      tags: [chat]
      summary: Send a chat message to the assistant
      description: JWT is validated by the gateway the same way as /api/upload.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }
        "400":
          description: >
            Malformed request, unknown JSON fields, missing current_message, or a rejected
            image (invalid or expired filetoken, image host outside the allow-list, image too large).
            For rejected images, `message` holds a user-facing explanation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }
        "401": { description: "Missing/invalid token" }
        "413": { description: "Request body larger than 1 MiB" }
        "429":
          description: Rate limited by the model provider; `message` holds a user-facing explanation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiEnvelopeString" }
        "500": { description: "Internal error" }
        "503": { description: "Core or the model provider is unavailable" }
        "504": { description: "Request timed out" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiEnvelope:
      type: object
      properties:
        success: { type: boolean }
        message: {}
    ApiEnvelopeString:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
    PromptPart:
      type: object
      required: [type, content]
      properties:
        type: { type: string, enum: [text, image] }
        content: { type: string, description: "Text content, or for an image part the `key` returned by /api/upload or an http(s) URL on Core's ALLOWED_IMAGE_DOMAINS" }
        mime_type: { type: string, description: "Required when type=image" }
    PromptMessage:
      type: object
      properties:
        parts:
          type: array
          items: { $ref: "#/components/schemas/PromptPart" }
    Language:
      oneOf:
        - { type: string, enum: [LANGUAGE_UNSPECIFIED, LANGUAGE_EN, LANGUAGE_ZH] }
        - { type: integer, enum: [0, 1, 2] }
      description: "Enum name or number. LANGUAGE_UNSPECIFIED or omitted means LANGUAGE_EN."
    ChatRequest:
      type: object
      required: [current_message]
      description: "Decoded with protojson: snake_case (current_message) and camelCase (currentMessage) field names are both accepted."
      properties:
        language: { $ref: "#/components/schemas/Language" }
        current_message: { $ref: "#/components/schemas/PromptMessage" }
        history_messages:
          type: array
          items: { $ref: "#/components/schemas/PromptMessage" }
