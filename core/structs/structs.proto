syntax = "proto3";

package magic_conch_shell.v1;

option go_package = "github.com/lucap9056/magic-conch-shell/core/v3/structs";

service AssistantService {
  rpc Chat (Request) returns (Response);
}

enum Language {
  LANGUAGE_UNSPECIFIED = 0;
  LANGUAGE_EN = 1;
  LANGUAGE_ZH = 2;
}

message PromptPart {
  string type = 1;
  string content = 2;
  string mime_type = 3;
}

message PromptMessage {
  repeated PromptPart parts = 1;
}

message Request {
  Language language = 1;
  PromptMessage current_message = 2;
  repeated PromptMessage history_messages = 3;
}

message Response {
  string reply = 1;
}
